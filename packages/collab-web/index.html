<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7fc" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0b14" />

		<title>Agent session</title>
		<meta
			name="description"
			content="Browser guest client for a live agent session. Room keys remain in the URL fragment."
		/>

		<link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
		<link rel="icon" type="image/x-icon" href="./public/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="256x256" href="./public/favicon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="./public/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="./public/favicon-180x180.png" />
		<link rel="manifest" href="./public/manifest.webmanifest" />

		<meta name="robots" content="noindex, nofollow" />
	</head>
	<body>
		<div id="root"></div>
		<script>(function(){try{var s=localStorage.getItem("chudcode-collab-theme");var sys=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";var t=(s==="light"||s==="dark")?s:sys;document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}catch(e){}})();</script>
		<script type="module" src="./src/main.tsx"></script>
	</body>
</html>
