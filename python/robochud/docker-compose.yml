services:
  # ───────────────────────────────────────────────────────────────────────────
  # robochud orchestrator
  #
  # NOTE: `env_file:` is INTENTIONALLY ABSENT. We never want the gh-proxy's
  # PAT (`GITHUB_TOKEN` in .env) to leak into this container's environment.
  # Every variable below is an explicit allowlist; compose still reads `.env`
  # for `${VAR}` interpolation, but only the keys listed here flow into the
  # container. Adding a new secret means an explicit compose-level decision
  # about which container is allowed to see it.
  # ───────────────────────────────────────────────────────────────────────────
  robochud:
    build:
      # chud root: gives the web-builder stage access to the workspace
      # bun.lock + catalog (web/package.json refs `catalog:` versions).
      # python/robochud/data and chud-root excludes are filtered via
      # Dockerfile.robochud.dockerignore at the context root.
      context: ../..
      dockerfile: Dockerfile.robochud
      args:
        # Tag of the pre-built chud-base image produced by `bun run chud:image`
        # (sources: chud root /Dockerfile). Override per-environment as needed.
        CHUDCODE_BASE: chudware/chudcode:dev
    image: robochud:dev
    container_name: robochud
    # Stable hostname: os.hostname() inside the container feeds usage
    # attribution (x-chudcode-hostname → broker `clients.hostname`); without this
    # it reports the random docker container id.
    hostname: robochud
    # Phase B (graceful shutdown): gives the orchestrator at least
    # ROBOCHUD_SHUTDOWN_DRAIN_TIMEOUT_SECONDS + ROBOCHUD_SHUTDOWN_KILL_TIMEOUT_SECONDS
    # before SIGKILL. Defaults: 25 + 5 = 30s.
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      # --- gh-proxy channel ---
      # The orchestrator NEVER holds GITHUB_TOKEN; it talks to the sibling
      # gh-proxy container over the internal-only network.
      ROBOCHUD_GH_PROXY_URL: http://gh-proxy:8081
      ROBOCHUD_GH_PROXY_HMAC_KEY: ${ROBOCHUD_GH_PROXY_HMAC_KEY:?ROBOCHUD_GH_PROXY_HMAC_KEY must be set in .env}

      # --- webhook + identity ---
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set in .env}
      ROBOCHUD_BOT_LOGIN: ${ROBOCHUD_BOT_LOGIN:?ROBOCHUD_BOT_LOGIN must be set in .env}
      ROBOCHUD_GIT_AUTHOR_NAME: ${ROBOCHUD_GIT_AUTHOR_NAME:-}
      ROBOCHUD_GIT_AUTHOR_EMAIL: ${ROBOCHUD_GIT_AUTHOR_EMAIL:?ROBOCHUD_GIT_AUTHOR_EMAIL must be set in .env}
      ROBOCHUD_REPO_ALLOWLIST: ${ROBOCHUD_REPO_ALLOWLIST:?ROBOCHUD_REPO_ALLOWLIST must be set in .env}
      ROBOCHUD_MAINTAINER_LOGINS: ${ROBOCHUD_MAINTAINER_LOGINS:-}
      ROBOCHUD_REVIEWER_BOTS: ${ROBOCHUD_REVIEWER_BOTS:-}

      # --- PR review ---
      ROBOCHUD_PR_REVIEW_ENABLED: ${ROBOCHUD_PR_REVIEW_ENABLED:-true}

      # --- release sentinel ---
      ROBOCHUD_RELEASE_SENTINEL_ENABLED: ${ROBOCHUD_RELEASE_SENTINEL_ENABLED:-false}
      ROBOCHUD_RELEASE_COMMIT_PREFIX: "${ROBOCHUD_RELEASE_COMMIT_PREFIX:-chore: bump version to }"
      ROBOCHUD_RELEASE_MAX_ROUNDS: ${ROBOCHUD_RELEASE_MAX_ROUNDS:-5}
      ROBOCHUD_RELEASE_TASK_TIMEOUT_SECONDS: ${ROBOCHUD_RELEASE_TASK_TIMEOUT_SECONDS:-3600}
      ROBOCHUD_RELEASE_MODEL: ${ROBOCHUD_RELEASE_MODEL:-}

      # --- model selection ---
      ROBOCHUD_MODEL: ${ROBOCHUD_MODEL:-anthropic/claude-sonnet-4-6}
      ROBOCHUD_PROVIDER: ${ROBOCHUD_PROVIDER:-}
      ROBOCHUD_THINKING: ${ROBOCHUD_THINKING:-high}

      # --- runtime tuning ---
      ROBOCHUD_MAX_CONCURRENCY: ${ROBOCHUD_MAX_CONCURRENCY:-8}
      ROBOCHUD_TASK_TIMEOUT_SECONDS: ${ROBOCHUD_TASK_TIMEOUT_SECONDS:-2400}
      ROBOCHUD_TASK_TIMEOUT_HARD_GRACE_SECONDS: ${ROBOCHUD_TASK_TIMEOUT_HARD_GRACE_SECONDS:-60}
      ROBOCHUD_REQUEST_TIMEOUT_SECONDS: ${ROBOCHUD_REQUEST_TIMEOUT_SECONDS:-120}
      ROBOCHUD_RATE_LIMIT_WINDOW_SECONDS: ${ROBOCHUD_RATE_LIMIT_WINDOW_SECONDS:-3600}
      ROBOCHUD_RATE_LIMIT_DEFAULT: ${ROBOCHUD_RATE_LIMIT_DEFAULT:-3}
      ROBOCHUD_RATE_LIMIT_CONTRIBUTOR: ${ROBOCHUD_RATE_LIMIT_CONTRIBUTOR:-10}
      ROBOCHUD_RATE_LIMIT_UNLIMITED: ${ROBOCHUD_RATE_LIMIT_UNLIMITED:-}
      ROBOCHUD_QUESTION_AUTOCLOSE_ENABLED: ${ROBOCHUD_QUESTION_AUTOCLOSE_ENABLED:-true}
      ROBOCHUD_QUESTION_AUTOCLOSE_HOURS: ${ROBOCHUD_QUESTION_AUTOCLOSE_HOURS:-4}
      ROBOCHUD_QUESTION_AUTOCLOSE_SCAN_SECONDS: ${ROBOCHUD_QUESTION_AUTOCLOSE_SCAN_SECONDS:-60}
      ROBOCHUD_REPLAY_TOKEN: ${ROBOCHUD_REPLAY_TOKEN:-}

      # --- container-fixed paths ---
      ROBOCHUD_OMP_COMMAND: chudcode
      ROBOCHUD_WORKSPACE_ROOT: /data/workspaces
      ROBOCHUD_SQLITE_PATH: /data/robochud.sqlite
      ROBOCHUD_LOG_DIR: /data/logs
      ROBOCHUD_BIND_HOST: ${ROBOCHUD_BIND_HOST:-0.0.0.0}
      ROBOCHUD_BIND_PORT: ${ROBOCHUD_BIND_PORT:-8080}
      CHUDCODE_ROOT: /work/pi
    depends_on:
      gh-proxy:
        condition: service_started
    # Resolve `llm-gateway.internal` (used in /srv/agent-home/.chudcode/agent/models.yml) to the
    # Docker host. The actual gateway listens on 127.0.0.1:4000 on the host;
    # `host-gateway` is Docker's alias for the host bridge IP.
    extra_hosts:
      - "llm-gateway.internal:host-gateway"
    networks:
      - default
      - robomp_internal
    volumes:
      - ${CHUDCODE_ROOT:-../..}:/work/pi:ro
      - robomp_data:/data
      # Host agent config is mounted read-only under /srv/agent-home-stage
      # with host-controlled permissions. The entrypoint copies it into
      # root-owned, world-readable files under /srv/agent-home; the agent
      # subprocess runs with HOME=/srv/agent-home, so ~/.chudcode and ~/.agent
      # resolve there without exposing mutable host mounts.
      - ${HOME}/.chudcode/agent/models.container.yml:/srv/agent-home-stage/.chudcode/agent/models.yml:ro
      - ${HOME}/.agent/AGENTS.md:/srv/agent-home-stage/.agent/AGENTS.md:ro
      - ${HOME}/.agent/rules:/srv/agent-home-stage/.agent/rules:ro
    ports:
      - "0.0.0.0:6543:8080"

  # ───────────────────────────────────────────────────────────────────────────
  # gh-proxy
  #
  # The only container that ever holds GITHUB_TOKEN. Reachable only from the
  # orchestrator on the internal-only network — no host port mapping. Every
  # request must carry a valid HMAC signature (ROBOCHUD_GH_PROXY_HMAC_KEY).
  # `env_file:` is INTENTIONALLY ABSENT for the same reason: the explicit
  # allowlist below is the only place where any var lands in this container.
  # ───────────────────────────────────────────────────────────────────────────
  gh-proxy:
    image: robochud:dev
    container_name: gh-proxy
    restart: unless-stopped
    command: ["python", "-m", "robochud.proxy", "serve"]
    environment:
      # PAT: lives ONLY here. The orchestrator's compose block refuses to
      # let this var into its container.
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN must be set in .env}
      # Shared with the orchestrator: HMAC verification key.
      ROBOCHUD_GH_PROXY_HMAC_KEY: ${ROBOCHUD_GH_PROXY_HMAC_KEY:?ROBOCHUD_GH_PROXY_HMAC_KEY must be set in .env}
      # The proxy reuses the SandboxManager pool layout under /data/workspaces.
      ROBOCHUD_WORKSPACE_ROOT: /data/workspaces
      ROBOCHUD_SQLITE_PATH: /data/robochud.sqlite
      ROBOCHUD_LOG_DIR: /data/logs
      # Bind on the internal network only.
      ROBOCHUD_GH_PROXY_BIND_HOST: 0.0.0.0
      ROBOCHUD_GH_PROXY_BIND_PORT: 8081
      # Settings still requires these on construction; the proxy never uses
      # them but the validator runs the same code path as the orchestrator.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set in .env}
      ROBOCHUD_BOT_LOGIN: ${ROBOCHUD_BOT_LOGIN:?ROBOCHUD_BOT_LOGIN must be set in .env}
      ROBOCHUD_GIT_AUTHOR_EMAIL: ${ROBOCHUD_GIT_AUTHOR_EMAIL:?ROBOCHUD_GIT_AUTHOR_EMAIL must be set in .env}
      ROBOCHUD_REPO_ALLOWLIST: ${ROBOCHUD_REPO_ALLOWLIST:?ROBOCHUD_REPO_ALLOWLIST must be set in .env}
    networks:
      # `default` gives gh-proxy outbound NAT to api.github.com; `robomp_internal`
      # is how the orchestrator reaches it. No `ports:` mapping → still
      # unreachable from the host or any sibling project.
      - default
      - robomp_internal
    volumes:
      # Shared workspace pool/worktrees so the proxy can drive git operations
      # against the same per-issue worktrees the orchestrator builds.
      - robomp_data:/data

networks:
  # External-facing bridge: webhook ingress (8080) and the orchestrator's
  # outbound path to the host LLM gateway via extra_hosts.
  default: {}
  # Orchestrator <-> gh-proxy only. internal: true means no egress and no
  # ingress from outside the compose project.
  robomp_internal:
    internal: true

volumes:
  # Docker-managed Linux volume so UID/GID permissions on /data are enforced.
  robomp_data: {}
