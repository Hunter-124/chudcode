name: "Install native addon artifacts"
description: >
   Installs exact native addon targets without invoking Bazel. Private
   controller jobs use the verified same-runner handoff or draft release;
   hosted jobs download artifacts only from their own workflow run.

inputs:
   targets:
      description: Space-separated scripts/bazel-natives.ts target names
      required: true
   dest:
      description: Destination directory for the .node files
      required: false
      default: packages/natives/native
   from:
      description: "`handoff` (private same-runner), `release` (draft release), or `workflow` (hosted same-run artifacts)"
      required: false
      default: handoff
   release-id:
      description: Draft release id that holds the staged addons (required for `release`)
      required: false
      default: ""
   repository:
      description: Repository holding the draft release
      required: false
      default: ${{ github.repository }}
   token:
      description: Source-repository Contents-write token (GitHub requires write access for unpublished drafts)
      required: false
      default: ${{ github.token }}
   source-sha:
      description: Exact checked-out source commit for same-runner handoff verification
      required: false
      default: ""

runs:
   using: composite
   steps:
      - name: Reject unknown native addon source
        if: inputs.from != 'handoff' && inputs.from != 'release' && inputs.from != 'workflow'
        shell: bash
        run: |
           echo "::error::native-artifacts input 'from' must be 'handoff', 'release' or 'workflow'"
           exit 1

      - name: Reject workflow artifacts outside hosted jobs
        if: inputs.from == 'workflow' && runner.environment != 'github-hosted'
        shell: bash
        run: |
           echo "::error::Workflow native artifacts are restricted to GitHub-hosted jobs"
           exit 1

      - name: Download this workflow run's native addons
        if: inputs.from == 'workflow' && runner.environment == 'github-hosted'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
           pattern: natives-*
           merge-multiple: false
           path: ${{ runner.temp }}/chudcode-native-artifacts

      - name: Download staged native addons from the draft release
        if: inputs.from == 'release' && runner.os != 'Windows'
        shell: bash
        env:
           CHUDCODE_RELEASE_REPOSITORY: ${{ inputs.repository }}
           GITHUB_TOKEN: ${{ inputs.token }}
           RELEASE_ID: ${{ inputs.release-id }}
           NATIVE_TARGETS: ${{ inputs.targets }}
        run: bun scripts/ci-release-transport.ts get-natives --release-id "$RELEASE_ID" --targets "$NATIVE_TARGETS" --out "$RUNNER_TEMP/chudcode-native-artifacts"

      - name: Download staged native addons from the draft release (Windows)
        if: inputs.from == 'release' && runner.os == 'Windows'
        shell: powershell
        env:
           CHUDCODE_RELEASE_REPOSITORY: ${{ inputs.repository }}
           GITHUB_TOKEN: ${{ inputs.token }}
           RELEASE_ID: ${{ inputs.release-id }}
           NATIVE_TARGETS: ${{ inputs.targets }}
        run: |
           bun scripts/ci-release-transport.ts get-natives --release-id "$env:RELEASE_ID" --targets "$env:NATIVE_TARGETS" --out "$env:RUNNER_TEMP/chudcode-native-artifacts"
           if ($LASTEXITCODE -ne 0) { throw 'Downloading staged native addons failed' }

      - name: Verify same-runner native addon handoff
        if: inputs.from == 'handoff'
        shell: bash
        env:
           CHUDCODE_SOURCE_SHA: ${{ inputs.source-sha || env.CHUDCODE_SOURCE_SHA || github.sha }}
           HANDOFF_ROOT: ${{ github.workspace }}/../ci-handoff
           NATIVE_TARGETS: ${{ inputs.targets }}
        run: bun scripts/ci-native-handoff.ts assemble --root "$HANDOFF_ROOT" --targets "$NATIVE_TARGETS" --out "$RUNNER_TEMP/chudcode-native-artifacts"

      - name: Install native addon targets
        if: runner.os != 'Windows'
        shell: bash
        env:
           NATIVE_TARGETS: ${{ inputs.targets }}
           NATIVE_DEST: ${{ inputs.dest }}
        run: |
           set -euo pipefail
           read -r -a targets <<< "$NATIVE_TARGETS"
           if [ "${#targets[@]}" -eq 0 ]; then
             echo "::error::At least one native addon target is required"
             exit 1
           fi
           bun scripts/bazel-natives.ts "${targets[@]}" \
             --source "$RUNNER_TEMP/chudcode-native-artifacts" \
             --dest "$NATIVE_DEST"

      - name: Install native addon targets (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
           NATIVE_TARGETS: ${{ inputs.targets }}
           NATIVE_DEST: ${{ inputs.dest }}
        run: |
           $targets = @($env:NATIVE_TARGETS -split '\s+' | Where-Object { $_ })
           if ($targets.Count -eq 0) { throw 'At least one native addon target is required' }
           bun scripts/bazel-natives.ts @targets --source "$env:RUNNER_TEMP/chudcode-native-artifacts" --dest "$env:NATIVE_DEST"
           if ($LASTEXITCODE -ne 0) { throw 'Installing native addon targets failed' }
