name: Setup system deps
description: >-
   Install the canvas/native runtime deps CI needs (cairo/pango stack, fd,
   ripgrep, imagemagick) when they are not preinstalled.

runs:
   using: composite
   steps:
      - name: Install system deps when missing
        shell: bash
        run: |
           set -euo pipefail
           if ! command -v fd >/dev/null 2>&1 \
              || ! command -v rg >/dev/null 2>&1 \
              || { ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; } \
              || ! pkg-config --exists cairo pango 2>/dev/null; then
             if command -v dnf >/dev/null 2>&1; then
               sudo dnf install -y cairo-devel pango-devel libjpeg-turbo-devel giflib-devel librsvg2-devel fd-find ripgrep ImageMagick
             elif command -v apt-get >/dev/null 2>&1; then
               sudo apt-get update
               sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep imagemagick
             else
               echo "::error::Unsupported Linux distribution: provision cairo, pango, fd, rg and ImageMagick on this runner"
               exit 1
             fi
           fi
           # Debian names these commands fdfind/convert. Do not alter the
           # machine's /usr/local/bin from a self-hosted CI job.
           tools="$RUNNER_TEMP/chudcode-system-bin"
           mkdir -p "$tools"
           if ! command -v fd >/dev/null 2>&1; then ln -sf "$(command -v fdfind)" "$tools/fd"; fi
           if ! command -v magick >/dev/null 2>&1; then ln -sf "$(command -v convert)" "$tools/magick"; fi
           echo "$tools" >> "$GITHUB_PATH"
