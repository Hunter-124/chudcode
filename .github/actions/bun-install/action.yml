name: "bun install (persistent local cache)"
description: >
   Ensure pinned Bun is on PATH, then install frozen workspace dependencies.
   Self-hosted runners keep Bun's package store in their persistent HOME (or
   the cluster PVC through BUN_INSTALL_CACHE_DIR), never in Actions storage.

runs:
   using: composite
   steps:
      - name: Detect environment
        id: env
        shell: bash
        run: |
           # Reuse the runner's Bun only when it matches packageManager.
           # Otherwise install the pinned version before dependency install.
           want="$(sed -n 's/.*"packageManager": *"bun@\([^"]*\)".*/\1/p' package.json)"
           if [ -z "$want" ]; then
             echo "::error::could not read pinned bun version from package.json packageManager"
             exit 1
           fi
           echo "bun_version=$want" >> "$GITHUB_OUTPUT"
           have=""
           if command -v bun >/dev/null 2>&1; then
             have="$(bun --version)"
           fi
           if [ "$have" = "$want" ]; then
             echo "setup_bun=false" >> "$GITHUB_OUTPUT"
             echo "bun present: $have (matches pin)"
           else
             echo "setup_bun=true" >> "$GITHUB_OUTPUT"
             echo "bun on runner: ${have:-none}; installing pinned $want"
           fi
      - name: Install pinned bun when missing or mismatched
        if: steps.env.outputs.setup_bun == 'true'
        shell: bash
        run: |
           export BUN_INSTALL="${HOME}/.bun"
           curl -fsSL https://bun.sh/install | bash -s "bun-v${{ steps.env.outputs.bun_version }}"
           echo "${BUN_INSTALL}/bin" >> "$GITHUB_PATH"

      - name: Prepare persistent bun store
        shell: bash
        run: mkdir -p "${BUN_INSTALL_CACHE_DIR:-${HOME}/.bun/install/cache}"

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile
