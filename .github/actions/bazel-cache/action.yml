name: "Compose bazel cache config"
description: >
   Selects the CI cache backend and emits a bazelrc fragment. GitHub-hosted
   jobs use only disposable runner-local storage, never remote credentials.
   Private cluster jobs use their remote cache; Cloudcastle machines keep
   persistent local caches. Build caches never enter Actions cache storage.

outputs:
   rc:
      description: Path to the generated bazelrc fragment
      value: ${{ steps.compose.outputs.rc }}

runs:
   using: composite
   steps:
      - name: Detect bazel cache backend
        id: backend
        shell: bash
        env:
           RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
           set -euo pipefail
           remote=false
           if [ "$RUNNER_ENVIRONMENT" != github-hosted ] && { [ -n "${BAZEL_REMOTE_USER:-}" ] || [ -n "${BAZEL_REMOTE_PASSWORD:-}" ]; }; then
             if [ -z "${BAZEL_REMOTE_USER:-}" ] || [ -z "${BAZEL_REMOTE_PASSWORD:-}" ]; then
               echo "::error::BAZEL_REMOTE_USER and BAZEL_REMOTE_PASSWORD must both be set"
               exit 1
             fi
             remote=true
           fi
           echo "remote=$remote" >> "$GITHUB_OUTPUT"

      - name: Compose cache config
        id: compose
        shell: bash
        env:
           REMOTE: ${{ steps.backend.outputs.remote }}
           RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
           set -euo pipefail

           rc="$RUNNER_TEMP/bazel-cache.rc"
           if [ "$REMOTE" = "true" ]; then
             # Mask the derived credential BEFORE writing the rc: config=ci
             # enables --announce_rc, which prints --remote_header verbatim.
             # Mask lines inside the redirected block below would land in the
             # rc file itself and mask nothing.
             raw_auth="${BAZEL_REMOTE_USER}:${BAZEL_REMOTE_PASSWORD}"
             auth="$(printf %s "$raw_auth" | base64 | tr -d '\n')"
             echo "::add-mask::$raw_auth"
             echo "::add-mask::$auth"
             {
               # The PVC mount lives outside $HOME. Pods are single-job and
               # use RUNNER_TEMP for Bazel's output root.
               echo "startup --output_user_root=$RUNNER_TEMP/bazel-root"
               echo "build --config=ci"
               echo "build --action_env=CCACHE_DISABLE=1"
               echo "common --repository_cache=/opt/bazel-repo-cache"
               echo "common --repo_env=OMP_XWIN_CACHE_DIR=/opt/bazel-repo-cache/xwin"
               echo "build --config=cache-rw"
               echo "common --remote_cache=grpcs://bazel-remote.bazel-cache.svc.cluster.local:9092"
               echo "common --tls_certificate=infra/bazel-remote/ca.crt"
               echo "common --remote_header='authorization=Basic ${auth}'"
               echo "common --remote_download_toplevel"
             } > "$rc"
           elif [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
             # No shared cache or private paths on a disposable hosted VM.
             mkdir -p "$RUNNER_TEMP/bazel-repo"
             {
               echo "startup --output_user_root=$RUNNER_TEMP/bazel-root"
               echo "build --config=ci"
               echo "build --action_env=CCACHE_DISABLE=1"
               echo "common --repository_cache=$RUNNER_TEMP/bazel-repo"
             } > "$rc"
           else
             # RUNNER_TEMP is isolated per runner instance. Bazel outputs must
             # not be shared between concurrent jobs: `clean --expunge` in the
             # validation job must never expunge another job's active server.
             # The content-addressed disk/repo caches persist across jobs in
             # the runner account's HOME; never archive them to Actions cache.
             mkdir -p "$HOME/.cache/chudcode-bazel-disk" "$HOME/.cache/chudcode-bazel-repo"
             {
               echo "startup --output_user_root=$RUNNER_TEMP/bazel-root"
               echo "build --config=ci"
               # Fedora's /usr/lib64/ccache compiler wrappers cannot write
               # to HOME inside Bazel's sandbox; Bazel's own disk cache remains.
               echo "build --action_env=CCACHE_DISABLE=1"
               echo "common --disk_cache=$HOME/.cache/chudcode-bazel-disk"
               echo "common --repository_cache=$HOME/.cache/chudcode-bazel-repo"
             } > "$rc"
           fi

           echo "rc=$rc" >> "$GITHUB_OUTPUT"
