name: Workbench release qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chudcode-workbench-qualification
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUN_VERSION: '1.4.0'

jobs:
  draft:
    name: Stage an exact-source workbench candidate
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, cloudcastle-ci, cc-linux-chudcode]
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Select a separate candidate tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(bun -e 'import {PRODUCT_SEMVER} from "./packages/coding-agent/src/brand.ts"; process.stdout.write(PRODUCT_SEMVER)')
          echo "tag=chudcode-workbench-v${version}-rc.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Create an unpublished draft bound to this commit
        id: draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ steps.tag.outputs.tag }}
        run: bun scripts/ci-release-transport.ts draft --tag "$CANDIDATE_TAG" --target "$GITHUB_SHA"

  native_addons:
    name: Build baseline and modern native payloads
    needs: draft
    runs-on: [self-hosted, cloudcastle-ci, cc-linux-chudcode]
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - uses: ./.github/actions/setup-bazelisk
      - id: cache
        uses: ./.github/actions/bazel-cache
      - name: Build exact native targets
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build \
            //:natives-linux-x64-baseline //:natives-linux-x64-modern //:natives-win32-x64-baseline
      - name: Stage addons without Actions artifact storage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
        run: bun scripts/ci-release-transport.ts put-natives --release-id "$RELEASE_ID" --root bazel-bin --targets "linux-x64-baseline linux-x64-modern win32-x64-baseline"

  native:
    name: Qualify workbench ${{ matrix.target }}
    needs: [draft, native_addons]
    runs-on: [self-hosted, cloudcastle-ci, '${{ matrix.runner }}']
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            engine-target: linux-x64
            runner: cc-linux-chudcode
            addons: linux-x64-baseline linux-x64-modern
          - target: darwin-x64
            engine-target: macos-x64
            runner: cc-mac-chudcode-intel
            addons: darwin-x64-baseline
          - target: win32-x64
            engine-target: windows-x64
            runner: cc-win-chudcode
            addons: win32-x64-baseline
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      ENGINE_TARGET: ${{ matrix.engine-target }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: runner.os != 'Windows'
        with:
          bun-version: '1.4.0'
      - name: Install isolated Bun on the Windows product account
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'workbench-bun.zip'
          $root = Join-Path $env:RUNNER_TEMP 'workbench-bun'
          Invoke-WebRequest "https://github.com/oven-sh/bun/releases/download/bun-v${env:BUN_VERSION}/bun-windows-x64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $binary = Join-Path $root 'bun-windows-x64\bun.exe'
          if (-not (Test-Path -LiteralPath $binary)) { throw 'Bun archive missing bun.exe' }
          (Split-Path $binary) | Out-File -Append -Encoding ascii $env:GITHUB_PATH
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: nightly-2026-08-12
      - name: Install workspace dependencies on Unix
        if: runner.os != 'Windows'
        run: bun install --frozen-lockfile
      - name: Isolate Cargo build output
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/workbench-cargo" >> "$GITHUB_ENV"
      - name: Install workspace dependencies on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Workspace dependency installation failed' }
      - uses: ./.github/actions/native-artifacts
        if: runner.os != 'macOS'
        with:
          targets: ${{ matrix.addons }}
          from: release
          release-id: ${{ needs.draft.outputs.release-id }}
      - uses: ./.github/actions/bazel-natives
        if: runner.os == 'macOS'
        with:
          targets: darwin-x64-baseline
      - name: Build native launcher, engine and extension on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-12 build --locked --release -p chudcode-desktop
          node packages/chudcode-workbench/scripts/build.mjs
          bun packages/chudcode-workbench/scripts/build-engine.ts --output "$RUNNER_TEMP/workbench-engine" --target "$ENGINE_TARGET"
      - name: Build native launcher, engine and extension on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          cargo +nightly-2026-08-12 build --locked --release -p chudcode-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Rust launcher build failed' }
          node packages/chudcode-workbench/scripts/build.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Workbench extension build failed' }
          bun packages/chudcode-workbench/scripts/build-engine.ts --output "$env:RUNNER_TEMP/workbench-engine" --target "$env:ENGINE_TARGET"
          if ($LASTEXITCODE -ne 0) { throw 'Native compatibility engine build failed' }
      - name: Qualify and archive the actual Unix workbench
        env:
          PI_NATIVE_VARIANT: baseline
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s packages/chudcode-workbench/test -p test_qualification.py -v
          python3 packages/chudcode-workbench/scripts/qualify.py \
            --output "$RUNNER_TEMP/workbench-qualified" \
            --launcher "$CARGO_TARGET_DIR/release/chudcode-desktop" \
            --engine "$RUNNER_TEMP/workbench-engine"
      - name: Qualify and archive the actual Windows workbench
        env:
          PI_NATIVE_VARIANT: baseline
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s packages/chudcode-workbench/test -p test_qualification.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Qualification process ownership tests failed' }
          python packages/chudcode-workbench/scripts/qualify.py --output "$env:RUNNER_TEMP/workbench-qualified" --launcher "$env:CARGO_TARGET_DIR/release/chudcode-desktop.exe" --engine "$env:RUNNER_TEMP/workbench-engine"
          if ($LASTEXITCODE -ne 0) { throw 'Native workbench qualification failed' }
      - name: Attach qualified Unix archive and evidence to the draft
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
        shell: bash
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP"/workbench-qualified/chudcode-workbench-* "$RUNNER_TEMP"/workbench-qualified/workbench-qualification-*.json; do
            test -f "$file"
            bun scripts/ci-release-transport.ts put --release-id "$RELEASE_ID" --file "$file"
          done
      - name: Attach qualified Windows archive and evidence to the draft
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'workbench-qualified'
          $files = @(Get-ChildItem -LiteralPath $root -File | Where-Object { $_.Name -like 'chudcode-workbench-*' -or $_.Name -like 'workbench-qualification-*.json' })
          if ($files.Count -ne 3) { throw 'Expected exactly archive, checksum and qualification report' }
          foreach ($file in $files) {
            bun scripts/ci-release-transport.ts put --release-id "$env:RELEASE_ID" --file "$($file.FullName)"
            if ($LASTEXITCODE -ne 0) { throw 'Attaching qualified workbench evidence failed' }
          }

  readiness:
    name: Record native qualification without promoting stable
    needs: [draft, native]
    runs-on: [self-hosted, cloudcastle-ci, cc-linux-chudcode]
    steps:
      - name: Record candidate release and remaining promotion gates
        env:
          CANDIDATE_TAG: ${{ needs.draft.outputs.tag }}
        run: |
          {
            printf '%s\n' "Native x64 workbench archives passed qualification for $GITHUB_SHA."
            printf '%s\n' "Draft candidate: $CANDIDATE_TAG. No stable release or latest-release pointer was changed."
            printf '%s\n' 'Signing/notarization, live-provider/deployed-consumer qualification and performance/accessibility evidence remain separate promotion gates.'
          } >> "$GITHUB_STEP_SUMMARY"
