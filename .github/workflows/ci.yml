name: CI

on:
  push:
    branches: [main]
    tags: ["chudcode-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/chudcode-v') }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUN_VERSION: "1.4.0"

jobs:
  release_metadata:
    name: Validate release ref and product version
    runs-on: [self-hosted, cloudcastle-ci, cc-linux-chudcode]
    outputs:
      is-release: ${{ steps.tag.outputs.is-release }}
      release-tag: ${{ steps.tag.outputs.release-tag }}
      product-version: ${{ steps.tag.outputs.product-version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Check release ref against brand
        id: tag
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/chudcode-v* ]]; then
            expected=$(bun -e 'import {PRODUCT_RELEASE_TAG_PREFIX,PRODUCT_SEMVER} from "./packages/coding-agent/src/brand.ts"; process.stdout.write(PRODUCT_RELEASE_TAG_PREFIX+PRODUCT_SEMVER)')
            tag=${REF#refs/tags/}
            test "$tag" = "$expected" || { echo "::error::Release tag $tag does not match brand $expected"; exit 1; }
            product_version=$(bun -e 'import {PRODUCT_VERSION} from "./packages/coding-agent/src/brand.ts"; process.stdout.write(PRODUCT_VERSION)')
            {
              printf 'product-version=%s\n' "$product_version"
              echo "is-release=true"
              echo "release-tag=$tag"
            } >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            echo '::error::Manual release must be dispatched against a chudcode-v* tag'
            exit 1
          else
            echo 'is-release=false' >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Lint and type check
    runs-on: [self-hosted, cloudcastle-ci, cc-linux-chudcode]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/bun-install
      - run: bun run ci:check:full

  rust_validate:
    name: Rust tests, clippy and pinned rustfmt
    runs-on: [self-hosted, cloudcastle-ci, cc-linux-chudcode]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup-bazelisk
      - id: cache
        uses: ./.github/actions/bazel-cache
      - name: Rust tests
        run: |
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" test //crates/...
      - name: Clippy (upstream workspace policy)
        run: |
          bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" query "kind('rust_library|rust_shared_library', //crates/pi-ast/... + //crates/pi-diff/... + //crates/pi-edit/... + //crates/pi-iso/... + //crates/pi-natives/... + //crates/pi-shell/... + //crates/pi-vcs/... + //crates/pi-voice/... + //crates/pi-walker/...)" |
            xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-strict --
      - name: Clippy (ported builtins)
        run: |
          bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" query "kind('rust_library|rust_shared_library', //crates/pi-builtins/...)" |
            xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-ported --
      - name: Clippy (other crates)
        run: |
          bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" query "kind('rust_library|rust_shared_library', //crates/... - (//crates/pi-ast/... + //crates/pi-diff/... + //crates/pi-edit/... + //crates/pi-iso/... + //crates/pi-natives/... + //crates/pi-shell/... + //crates/pi-vcs/... + //crates/pi-voice/... + //crates/pi-walker/...) - //crates/pi-builtins/... - //crates/vendor/brush-core/...)" |
            xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy --
      - name: Clear ephemeral outputs before pinned rustfmt toolchain
        run: bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" clean --expunge
      - name: Rustfmt
        run: bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=rustfmt //crates/...

  native_addon_build:
    name: Build native addon ${{ matrix.target }}
    runs-on: [self-hosted, cloudcastle-ci, cc-linux-chudcode]
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64-baseline, linux-x64-modern, win32-x64-baseline]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - uses: ./.github/actions/setup-bazelisk
      - name: Check Windows cross-toolchain disk headroom
        if: matrix.target == 'win32-x64-baseline'
        shell: bash
        run: |
          available_kb=$(df -Pk "$HOME" | tail -1 | awk '{print $4}')
          if [ "$available_kb" -lt 15728640 ]; then
            echo "::error::Windows cross build requires 15 GiB free on the runner home filesystem"
            exit 1
          fi
      - id: cache
        uses: ./.github/actions/bazel-cache
      - name: Build target
        shell: bash
        run: |
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build //:natives-${{ matrix.target }}
      # Every native consumer of this handoff runs on the same private runner;
      # publish to its own storage instead of GitHub artifact storage.
      - name: Publish native addon handoff
        shell: bash
        env:
          HANDOFF_ROOT: ${{ runner.workspace }}/ci-handoff
          TARGET: ${{ matrix.target }}
        run: bun scripts/ci-native-handoff.ts publish --root "$HANDOFF_ROOT" --target "$TARGET" --file "bazel-bin/natives-$TARGET/pi_natives.$TARGET.node"

  native_addons:
    name: Assemble native addons
    needs: [release_metadata, native_addon_build]
    runs-on: [self-hosted, cloudcastle-ci, cc-linux-chudcode]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      # Assemble in this job's private temp dir, never the persistent workspace.
      - name: Verify all required targets
        shell: bash
        env:
          HANDOFF_ROOT: ${{ runner.workspace }}/ci-handoff
          ADDONS: ${{ runner.temp }}/native-addons
        run: bun scripts/ci-native-handoff.ts assemble --root "$HANDOFF_ROOT" --targets "linux-x64-baseline linux-x64-modern win32-x64-baseline" --out "$ADDONS"
      # Release consumers on the Windows/Mac runners still need GitHub transport.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.release_metadata.outputs.is-release == 'true'
        with:
          name: native-addons
          path: ${{ runner.temp }}/native-addons/natives-*/*.node
          if-no-files-found: error
          retention-days: 2

  test_typescript:
    name: TypeScript suites and desktop installer
    needs: [native_addons]
    runs-on: [self-hosted, cloudcastle-ci, cc-linux-chudcode]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/bun-install
      - uses: ./.github/actions/native-artifacts
        with:
          targets: linux-x64-baseline linux-x64-modern
          from: handoff
      - run: bun run ci:test:ts
      - name: Desktop installer safety and release manifest
        run: bun test scripts/install-desktop.test.ts scripts/ci-release-checksums.test.ts

  # linux-arm64 addon for the emulated lane only. Its own job, so no x64/Windows
  # producer or consumer waits for it; a failure here fails the arm64 lane.
  native_addon_build_linux_arm64:
    name: Build native addon linux-arm64
    runs-on: [self-hosted, cloudcastle-ci, cc-linux-chudcode]
    # Hard cap: setup plus the 25 min build deadline (exit 124 on expiry).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - uses: ./.github/actions/setup-bazelisk
      - id: cache
        uses: ./.github/actions/bazel-cache
      - name: Build target (25 min deadline)
        shell: bash
        run: |
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          bun scripts/ci-deadline.ts 1500 -- bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build //:natives-linux-arm64
      - name: Publish native addon handoff
        shell: bash
        env:
          HANDOFF_ROOT: ${{ runner.workspace }}/ci-handoff
        run: bun scripts/ci-native-handoff.ts publish --root "$HANDOFF_ROOT" --target linux-arm64 --file bazel-bin/natives-linux-arm64/pi_natives.linux-arm64.node

  # Emulated ARM Linux on the private x86_64 runner: aarch64 ELF Rust tests and
  # the real pi_natives suite on an aarch64 Bun, executed through the utility
  # VM's own qemu-aarch64 binfmt handler. Not native ARM hardware evidence.
  linux_arm64_emulated:
    name: Linux arm64 under qemu-user (Rust tests and native addon consumer)
    needs: [native_addon_build_linux_arm64]
    runs-on: [self-hosted, cloudcastle-ci, cc-linux-chudcode]
    # Hard cap for the whole lane. Each long command also has its own deadline
    # so a hang is attributed (exit 124): bazel test 30 min, arm64 Bun download
    # 3 min, probe 2 min, pi_natives suite 10 min. Nothing depends on this job.
    timeout-minutes: 45
    env:
      QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/bun-install
      - name: Verify qemu-aarch64 binfmt handler and GNU aarch64 sysroot
        run: bun scripts/ci-arm64-emulation.ts verify-host
      - uses: ./.github/actions/setup-bazelisk
      - id: cache
        uses: ./.github/actions/bazel-cache
      - name: Rust tests as aarch64 ELF under qemu-user (30 min deadline)
        run: |
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          bun scripts/ci-deadline.ts 1800 -- bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" test --config=linux-arm64-qemu //crates/...
      - uses: ./.github/actions/native-artifacts
        with:
          targets: linux-arm64
          from: handoff
      - name: Install pinned aarch64 Bun into this runner's tool cache
        id: arm64-bun
        run: echo "path=$(bun scripts/ci-arm64-emulation.ts install-bun --cache "$RUNNER_TOOL_CACHE/chudcode-bun-linux-aarch64")" >> "$GITHUB_OUTPUT"
      - name: pi_natives suite on aarch64 Bun with the linux-arm64 addon
        env:
          ARM64_BUN: ${{ steps.arm64-bun.outputs.path }}
        run: bun scripts/ci-arm64-emulation.ts consume --bun "$ARM64_BUN"

  # Intel Mac compile-only darwin-arm64 proof. Outputs are never executed,
  # published, signed or used as release inputs; native Apple silicon
  # qualification and the trusted signing lane stay separate.
  darwin_arm64_compile_only:
    name: darwin-arm64 compile-only on Intel Mac (not executed)
    runs-on: [self-hosted, cloudcastle-ci, cc-mac-chudcode-intel]
    # Hard cap: 10 min checkout/tool setup plus the script's own 50 min
    # deadline. Nothing depends on this job; no Apple silicon runner is used.
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Verify product-private Intel Mac test account
        shell: bash
        run: |
          set -euo pipefail
          case "$(id -un)" in ccci-chudcode|chudcode-ci) ;; *) echo '::error::Not the Chudcode test account'; exit 1;; esac
          test "$(stat -f %Lp "$HOME")" = 700
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/setup-bazelisk
      - id: cache
        uses: ./.github/actions/bazel-cache
      - name: Install CMake and Ninja
        run: |
          python3 -m venv "$RUNNER_TEMP/darwin-arm64-build-tools"
          "$RUNNER_TEMP/darwin-arm64-build-tools/bin/pip" install --disable-pip-version-check cmake==4.1.2 ninja==1.13.0
          echo "$RUNNER_TEMP/darwin-arm64-build-tools/bin" >> "$GITHUB_PATH"
      - name: Cross-compile darwin-arm64 addon, Rust tests and GUI; prove arm64 Mach-O
        env:
          OMP_BAZEL_RC: ${{ steps.cache.outputs.rc }}
        run: bash scripts/ci-darwin-arm64-compile-only.sh "$RUNNER_TEMP/darwin-arm64"

  release_binary_linux_windows:
    name: Release binary ${{ matrix.target }}
    needs: [release_metadata, native_addons]
    if: needs.release_metadata.outputs.is-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            addons: linux-x64-baseline linux-x64-modern
            asset: chudcode-linux-x64
          - target: win32-x64
            addons: win32-x64-baseline
            asset: chudcode-windows-x64.exe
    runs-on: [self-hosted, cloudcastle-ci, cc-linux-chudcode]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/bun-install
      - uses: ./.github/actions/native-artifacts
        with:
          targets: ${{ matrix.addons }}
      - name: Build release binary
        env:
          RELEASE_TARGETS: ${{ matrix.target }}
        run: bun run ci:release:build-binaries
      - name: Smoke Linux release binary
        if: matrix.target == 'linux-x64'
        run: |
          test "$(packages/coding-agent/binaries/chudcode-linux-x64 --version)" = '${{ needs.release_metadata.outputs.product-version }}'
          packages/coding-agent/binaries/chudcode-linux-x64 --smoke-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chudcode-binary-${{ matrix.target }}
          path: packages/coding-agent/binaries/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 2

  release_binary_windows_verify:
    name: Verify native Windows binary
    needs: [release_metadata, release_binary_linux_windows]
    if: needs.release_binary_linux_windows.result == 'success'
    runs-on: [self-hosted, cloudcastle-ci, cc-win-chudcode]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chudcode-binary-win32-x64
          path: ${{ runner.temp }}/chudcode-win32
      - name: Smoke Windows release binary (PowerShell 5.1)
        shell: powershell
        env:
          PRODUCT_VERSION: ${{ needs.release_metadata.outputs.product-version }}
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'chudcode-win32-smoke'
          $env:APPDATA = Join-Path $env:USERPROFILE 'AppData\Roaming'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          $binary = Join-Path $env:RUNNER_TEMP 'chudcode-win32\chudcode-windows-x64.exe'
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -ne $env:PRODUCT_VERSION) { throw "Unexpected Windows binary version: $version" }
          & $binary --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Windows binary smoke failed' }

  release_binary_darwin:
    name: Release binary darwin-x64
    needs: [release_metadata]
    if: needs.release_metadata.outputs.is-release == 'true'
    runs-on: [self-hosted, cloudcastle-ci, cc-mac-chudcode-intel]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/bazel-natives
        with:
          targets: darwin-x64-baseline
      - name: Build release binary
        env:
          RELEASE_TARGETS: darwin-x64
        run: bun run ci:release:build-binaries
      - name: Smoke release binary
        run: |
          test "$(packages/coding-agent/binaries/chudcode-darwin-x64 --version)" = '${{ needs.release_metadata.outputs.product-version }}'
          packages/coding-agent/binaries/chudcode-darwin-x64 --smoke-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chudcode-binary-darwin-x64
          path: packages/coding-agent/binaries/chudcode-darwin-x64
          if-no-files-found: error
          retention-days: 2

  desktop_release:
    name: Desktop bundle ${{ matrix.target }}
    needs: [release_metadata, native_addons]
    if: needs.release_metadata.outputs.is-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: cc-linux-chudcode
            archive: chudcode-desktop-linux-x64.tar.gz
            addons: linux-x64-baseline linux-x64-modern
          - target: macos-x64
            runner: cc-mac-chudcode-intel
            archive: chudcode-desktop-macos-x64.tar.gz
            addons: darwin-x64-baseline
          - target: windows-x64
            runner: cc-win-chudcode
            archive: chudcode-desktop-windows-x64.zip
            addons: win32-x64-baseline
    runs-on: [self-hosted, cloudcastle-ci, '${{ matrix.runner }}']
    env:
      DESKTOP_TARGET: ${{ matrix.target }}
      DESKTOP_ARCHIVE: ${{ matrix.archive }}
      GUI_BUILD_DIR: gui/build-release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # GUI CMake uses repository version and submodule history
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: runner.os != 'Windows'
        with:
          bun-version: '1.4.0'
      - name: Install isolated Bun (Windows product account)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'chudcode-bun.zip'
          $root = Join-Path $env:RUNNER_TEMP 'chudcode-bun'
          Invoke-WebRequest "https://github.com/oven-sh/bun/releases/download/bun-v${env:BUN_VERSION}/bun-windows-x64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          if (-not (Test-Path (Join-Path $root 'bun-windows-x64\bun.exe'))) { throw 'Bun archive missing bun.exe' }
          (Join-Path $root 'bun-windows-x64') | Out-File -Append -Encoding ascii $env:GITHUB_PATH
      - name: Install workspace dependencies (Unix)
        if: runner.os != 'Windows'
        run: bun install --frozen-lockfile
      - name: Install workspace dependencies (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'bun install failed' }
      - uses: ./.github/actions/native-artifacts
        if: matrix.target != 'macos-x64'
        with:
          targets: ${{ matrix.addons }}
      - uses: ./.github/actions/bazel-natives
        if: matrix.target == 'macos-x64'
        with:
          targets: darwin-x64-baseline
      - name: Install CMake and Ninja (Unix)
        if: runner.os != 'Windows'
        run: |
          python3 -m venv "$RUNNER_TEMP/desktop-build-tools"
          "$RUNNER_TEMP/desktop-build-tools/bin/pip" install --disable-pip-version-check cmake==4.1.2 ninja==1.13.0
          echo "$RUNNER_TEMP/desktop-build-tools/bin" >> "$GITHUB_PATH"
      - name: Install Linux GUI build prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y gcc gcc-c++ binutils xorg-x11-server-Xvfb xorg-x11-xauth \
              mesa-libGL-devel libX11-devel libXrandr-devel libXinerama-devel libXcursor-devel libXi-devel
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-12 g++-12 binutils xvfb xauth libgl1-mesa-dev xorg-dev
          else
            echo "::error::Linux GUI build requires dnf or apt provisioning"
            exit 1
          fi
      - name: Use Windows GUI toolchain
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'Windows GUI build requires Visual Studio 2022' }
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Cannot locate the installed Visual Studio C++ toolchain' }
          $cmake = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $cmake 'cmake.exe'))) { throw 'Visual Studio CMake component is missing' }
          $env:PATH = "$cmake;$env:PATH"
          $cmake | Out-File -Append -Encoding ascii $env:GITHUB_PATH
      - name: Build and test Linux GUI
        if: runner.os == 'Linux'
        run: |
          cmake -S gui -B "$GUI_BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build "$GUI_BUILD_DIR" --parallel "$(nproc)"
          ctest --test-dir "$GUI_BUILD_DIR" --output-on-failure
      - name: Build and test macOS GUI
        if: runner.os == 'macOS'
        run: bash packaging/macos/build-desktop.sh "$DESKTOP_TARGET" "$GUI_BUILD_DIR"
      - name: Build and test Windows GUI
        if: runner.os == 'Windows'
        shell: powershell
        env:
          # Same per-job PDB server endpoint as runner-smoke: service accounts
          # on this host share session 0 and must not reuse another's mspdbsrv.
          _MSPDBSRV_ENDPOINT_: chudcode-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.target }}
        run: |
          packaging/windows/build-desktop.ps1 -Target $env:DESKTOP_TARGET -BuildDir $env:GUI_BUILD_DIR
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI build failed' }
      - name: Package Unix desktop archive
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          epoch=$(git show -s --format=%ct HEAD)
          mkdir -p dist/desktop
          bun scripts/package-chudcode-desktop.ts --target "$DESKTOP_TARGET" --gui "$GUI_BUILD_DIR/chudcode-gui" --output "dist/desktop/$DESKTOP_ARCHIVE" --epoch "$epoch"
          bun scripts/ci-release-desktop.ts --archive "dist/desktop/$DESKTOP_ARCHIVE"
          if command -v sha256sum >/dev/null; then sha256sum "dist/desktop/$DESKTOP_ARCHIVE" > "dist/desktop/$DESKTOP_ARCHIVE.sha256";
          else shasum -a 256 "dist/desktop/$DESKTOP_ARCHIVE" > "dist/desktop/$DESKTOP_ARCHIVE.sha256"; fi
      - name: Package Windows desktop archive (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $epoch = git show -s --format=%ct HEAD
          New-Item -ItemType Directory -Force -Path dist/desktop | Out-Null
          bun scripts/package-chudcode-desktop.ts `
            --target $env:DESKTOP_TARGET `
            --gui "$env:GUI_BUILD_DIR/Release/chudcode-gui.exe" `
            --output "dist/desktop/$env:DESKTOP_ARCHIVE" `
            --epoch $epoch
          if ($LASTEXITCODE -ne 0) { throw 'Windows desktop packaging failed' }
          bun scripts/ci-release-desktop.ts --archive "dist/desktop/$env:DESKTOP_ARCHIVE"
          if ($LASTEXITCODE -ne 0) { throw 'Windows desktop archive verification failed' }
          $hash = (Get-FileHash -Algorithm SHA256 "dist/desktop/$env:DESKTOP_ARCHIVE").Hash.ToLowerInvariant()
          "$hash  $env:DESKTOP_ARCHIVE" | Set-Content -NoNewline -Encoding ascii "dist/desktop/$env:DESKTOP_ARCHIVE.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chudcode-desktop-${{ matrix.target }}
          path: |
            dist/desktop/${{ matrix.archive }}
            dist/desktop/${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 2

  release_github:
    name: Publish GitHub release
    needs: [release_metadata, check, rust_validate, test_typescript, release_binary_linux_windows, release_binary_windows_verify, release_binary_darwin, desktop_release]
    if: needs.release_metadata.outputs.is-release == 'true' && needs.check.result == 'success' && needs.rust_validate.result == 'success' && needs.test_typescript.result == 'success' && needs.release_binary_linux_windows.result == 'success' && needs.release_binary_windows_verify.result == 'success' && needs.release_binary_darwin.result == 'success' && needs.desktop_release.result == 'success'
    runs-on: [self-hosted, cloudcastle-ci, cc-linux-chudcode]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: chudcode-binary-*
          path: packages/coding-agent/binaries
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: chudcode-desktop-*
          path: dist/desktop
          merge-multiple: true
      - name: Generate checksums and authenticated desktop manifest
        run: |
          bun scripts/ci-release-checksums.ts SHA256SUMS.txt \
            packages/coding-agent/binaries/chudcode-linux-x64 \
            packages/coding-agent/binaries/chudcode-darwin-x64 \
            packages/coding-agent/binaries/chudcode-windows-x64.exe \
            dist/desktop/chudcode-desktop-linux-x64.tar.gz \
            dist/desktop/chudcode-desktop-macos-x64.tar.gz \
            dist/desktop/chudcode-desktop-windows-x64.zip \
            dist/desktop/*.sha256 LICENSE NOTICE THIRD-PARTY-NOTICES.txt
      - name: Verify desktop release manifest
        run: bun scripts/ci-release-desktop.ts dist/desktop release-manifest.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.release_metadata.outputs.release-tag }}
          files: |
            packages/coding-agent/binaries/chudcode-linux-x64
            packages/coding-agent/binaries/chudcode-darwin-x64
            packages/coding-agent/binaries/chudcode-windows-x64.exe
            dist/desktop/chudcode-desktop-*
            LICENSE
            NOTICE
            THIRD-PARTY-NOTICES.txt
            SHA256SUMS.txt
            release-manifest.json
          fail_on_unmatched_files: true
          generate_release_notes: true
