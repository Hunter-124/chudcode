name: Chudcode Nix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nix.yml"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "bun.lock"
      - "package.json"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - "docs/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nix.yml"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "bun.lock"
      - "package.json"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - "docs/**"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate flake
    runs-on: [self-hosted, cloudcastle-ci, cc-linux-chudcode]
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate every supported system in SELinux-compatible container
        shell: bash
        run: |
          podman run --rm --security-opt label=disable -v "$PWD":/src:ro -w /src docker.io/nixos/nix:2.32.4 sh -c \
            "git config --global --add safe.directory '*' && nix --extra-experimental-features 'nix-command flakes' --option accept-flake-config true flake check --all-systems --no-build --show-trace"
